name: X13 ShanX Streets Actual Browser QA

on:
  workflow_dispatch:
  push:
    paths:
      - 'arcade/games/shanx-streets/**'
      - 'scripts/shanx_streets_browser_qa.cjs'
      - '.github/workflows/shanx-streets-browser-qa.yml'

permissions:
  contents: read

jobs:
  chrome-collision-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright browser dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test real ShanX Streets runtime and known collision defects
        run: node scripts/shanx_streets_browser_qa.cjs
        env:
          SHANX_QA_FILE: arcade/games/shanx-streets/preview-v34-garage-orb.html
      - name: Preserve actual browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shanx-streets-browser-qa
          path: |
            /tmp/shanx-streets-desktop.png
            /tmp/shanx-streets-mobile.png
          if-no-files-found: ignore
          retention-days: 7
