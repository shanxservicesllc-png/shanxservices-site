function setChatMicActive(active){
 const button=$('#dictateShortcut');
 if(button){button.classList.toggle('listening',active);button.setAttribute('aria-pressed',String(active));button.textContent=active?'■':'🎤'}
 const status=$('#dictationStatus');

function stopChatDictation(cancel=false){
 const recognition=chatRecognition;state.dictating=false;
 if(recognition){try{if(cancel){chatRecognition=null;recognition.abort()}else recognition.stop()}catch{chatRecognition=null}}
 setChatMicActive(false);
}
function startChatDictation(input){
 if(chatRecognition){stopChatDictation(false);return}
 const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!Recognition){notify('Speech-to-text is unavailable in this browser. Try Chrome or the keyboard microphone.');return}
 const recognition=new Recognition();
 const previous=input.value.trimEnd();
 recognition.lang=navigator.language||'en-US';recognition.continuous=false;recognition.interimResults=true;
 recognition.onresult=event=>{
  if(chatRecognition!==recognition)return;
  const transcript=Array.from(event.results,part=>part[0]?.transcript||'').join(' ').trim();
  input.value=previous+(previous&&transcript?' ':'')+transcript;
 };
 recognition.onerror=event=>{if(chatRecognition===recognition)notify('Dictation: '+(event.error||'microphone error'))};
 recognition.onend=()=>{if(chatRecognition===recognition){chatRecognition=null;state.dictating=false;setChatMicActive(false)}};
 try{recognition.start();chatRecognition=recognition;state.dictating=true;setChatMicActive(true);input.focus()}
 catch(error){chatRecognition=null;state.dictating=false;setChatMicActive(false);notify('Could not start dictation: '+error.message)}
}

function pointOnCanvas(e){const c=$('#imageCanvas');const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*c.width,y:(e.clientY-r.top)/r.height*c.height}}
function drawEditor(includeMask=true){const img=state.editor.img;const c=$('#imageCanvas');if(!img||!c)return;c.style.display='block';const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height));c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.filter=`brightness(${state.editor.brightness}%) contrast(${state.editor.contrast}%)`;ctx.drawImage(img,0,0,c.width,c.height);ctx.filter='none';if(includeMask){ctx.strokeStyle='#6afa86';ctx.fillStyle='#80ff91';ctx.lineCap='round';ctx.lineJoin='round';ctx.globalAlpha=.5;for(const stroke of state.editor.maskStrokes){if(stroke.length===1){const p=stroke[0];ctx.beginPath();ctx.arc(p.x,p.y,p.brush/2,0,Math.PI*2);ctx.fill()}else{ctx.beginPath();ctx.moveTo(stroke[0].x,stroke[0].y);for(let i=1;i<stroke.length;i++)ctx.lineTo(stroke[i].x,stroke[i].y);ctx.lineWidth=stroke[0].brush;ctx.stroke()}}ctx.globalAlpha=1}}
async function workerPreview(file){return null}
async function loadEditor(fileOrUrl){
 let processed=fileOrUrl;
 if(typeof fileOrUrl!=='string'&&state.config.mode!=='remote'){
  try{const blob=await workerPreview(fileOrUrl);if(blob){processed=blob;notify('Local device worker prepared the editing preview')}}catch(e){console.info('Worker unavailable; standard browser canvas will be used')}
 }
 return new Promise((resolve,reject)=>{
  const img=new Image();const objectUrl=typeof processed!=='string';let url=objectUrl?URL.createObjectURL(processed):processed;
  img.onload=()=>{state.editor.img=img;state.editor.maskStrokes=[];const p=$('#studioPreview');if(p){$('.placeholder',p)?.remove();drawEditor()}if(objectUrl)setTimeout(()=>URL.revokeObjectURL(url),500);resolve()};
  img.onerror=()=>reject(new Error('Cannot open this image'));
  img.src=url;
 });
}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function downloadCanvas(type){const img=state.editor.img;if(!img){notify('Select an image first');return}const c=document.createElement('canvas');const onscreen=$('#imageCanvas');c.width=onscreen.width;c.height=onscreen.height;const ctx=c.getContext('2d');if(type==='image'){ctx.filter=`brightness(${state.editor.brightness}%) contrast(${state.editor.contrast}%)`;ctx.drawImage(img,0,0,c.width,c.height)}else{ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='#fff';ctx.fillStyle='#fff';ctx.lineCap='round';ctx.lineJoin='round';for(const s of state.editor.maskStrokes){if(s.length===1){ctx.beginPath();ctx.arc(s[0].x,s[0].y,s[0].brush/2,0,Math.PI*2);ctx.fill()}else{ctx.beginPath();ctx.moveTo(s[0].x,s[0].y);for(let i=1;i<s.length;i++)ctx.lineTo(s[i].x,s[i].y);ctx.lineWidth=s[0].brush;ctx.stroke()}}}c.toBlob(blob=>{if(blob)downloadBlob(blob,'MY_CHAT_'+(type==='image'?'edited':'mask')+'.png')},'image/png')}
async function uploadImage(file){if(file.size>20*1024*1024)throw new Error('20 MB upload limit');if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw new Error('Unsupported image format');const resp=await fetch('/api/assets',{method:'POST',headers:{'Content-Type':file.type,'X-Filename':encodeURIComponent(file.name),'X-Project':encodeURIComponent(state.project||'')},body:file});let result=await resp.json();if(!resp.ok)throw new Error(result.error);return result}
function showGallery(){const root=$('#gallery');if(!root)return;const filtered=($('#onlyProject')?.checked&&state.project)?state.assets.filter(a=>a.project_id===state.project):state.assets;root.innerHTML=filtered.length?filtered.map(a=>`<div class="asset"><img src="${h(a.url)}" alt="${h(a.name)}" loading="lazy"><div class="asset-footer"><div><div class="asset-name" title="${h(a.name)}">${h(a.name)}</div><label class="caption"><input type="checkbox" data-select-asset="${h(a.id)}" ${state.selection.has(a.id)?'checked':''}> Select</label></div><div><button data-open-asset="${h(a.id)}" title="Edit">✎</button><button data-download-asset="${h(a.id)}" title="Download">↓</button></div></div></div>`).join(''):'<div class="empty-card">The gallery is empty. Import or generate an image to begin.</div>';
 $$('[data-select-asset]').forEach(box=>box.onchange=e=>{if(box.checked)state.selection.add(box.dataset.selectAsset);else state.selection.delete(box.dataset.selectAsset);$('#archiveSelected').disabled=state.selection.size===0});
 $$('[data-open-asset]').forEach(b=>b.onclick=()=>loadEditor(offlineAssets.find(a=>a.id===b.dataset.openAsset)?.url||'').then(()=>{document.getElementById('studioPreview').scrollIntoView({behavior:'smooth',block:'center'});notify('Image loaded into editor')}));
 $$('[data-download-asset]').forEach(b=>b.onclick=()=>{const item=state.assets.find(a=>a.id===b.dataset.downloadAsset);const a=document.createElement('a');a.href=item?.url||'';a.download=item?.name||'image';a.click()});
 $('#archiveSelected').disabled=state.selection.size===0;
}
function voiceView(){return `<div class="page">${pageHeader('REAL AUDIO · NOT JUST DICTATION','Voice / Iris','Record your actual voice. Record your voice and save the audio file to your tablet. Live Iris transcription requires the connected edition.')}<div class="two-cols"><div class="surface" style="text-align:center"><div class="eyebrow">IRIS VOICE INTERFACE</div><div class="voice-orb" id="voiceOrb">◉</div><div class="wave" aria-hidden="true">${Array.from({length:38},(_,i)=>`<i style="--h:${8+Math.round(Math.abs(Math.sin(i*1.47)*Math.cos(i*.27))*52)}px;--delay:${i*20}ms"></i>`).join('')}</div><div class="form-row" style="justify-content:center"><button class="btn primary" id="recordButton">● Start recording</button><button class="btn gold" id="stopButton" disabled>■ Stop</button></div><p class="caption spaced" id="recordStatus">Microphone permission is requested only when you start recording.</p></div><div class="surface"><div class="section-title">Transcription & Commands</div><div class="provider-indicator">${state.status?.audio_ready?'Transcription backend configured':'Audio decoding provider not configured'}</div><div class="form-field spaced"><label>Your transcript</label><textarea rows="9" id="transcript" placeholder="Transcribed speech appears here. You can edit the text before sending it to MY CHAT.">${h(state.voiceTranscript||'')}</textarea></div><div class="form-row"><button class="btn primary" id="sendTranscript">Send to chat ↗</button><button class="btn quiet" id="browserSpeech">Use browser dictation</button></div><p class="caption spaced">Browser dictation is an optional fallback and may send speech to the browser vendor. Native audio capture uses MediaRecorder; the provider service is only called when configured.</p></div></div><div class="surface spaced"><h3>How Iris can work</h3><div class="mini-stats"><div class="stat">① Capture actual microphone audio</div><div class="stat">② Preserve the recording</div><div class="stat">③ Decode using configured STT</div><div class="stat">④ Send approved text to AI</div></div></div></div>`}
function attachVoice(){
 let stream=null;const rec=$('#recordButton'),stop=$('#stopButton'),status=$('#recordStatus');
 rec.onclick=async()=>{if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){notify('Audio capture is not supported in this browser');return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const options=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>MediaRecorder.isTypeSupported(t));const recorder=new MediaRecorder(stream,options?{mimeType:options}:undefined);state.mediaRecorder=recorder;state.audioChunks=[];recorder.ondataavailable=e=>{if(e.data.size)state.audioChunks.push(e.data)};recorder.onstop=async()=>{stream?.getTracks().forEach(t=>t.stop());const blob=new Blob(state.audioChunks,{type:recorder.mimeType.split(';')[0]||'audio/webm'});downloadBlob(blob,'MY_CHAT_voice_recording.'+(blob.type.includes('mp4')?'mp4':'webm'));status.textContent='Audio file downloaded to your tablet. Offline edition has no Iris transcription server.';notify(status.textContent);rec.disabled=false;stop.disabled=true;$('#voiceOrb')?.classList.remove('recording')};recorder.start();rec.disabled=true;stop.disabled=false;$('#voiceOrb').classList.add('recording');status.textContent='Recording actual microphone audio…'}catch(e){notify('Microphone error: '+e.message)}};
 stop.onclick=()=>{if(state.mediaRecorder?.state==='recording')state.mediaRecorder.stop()};
 $('#transcript').oninput=e=>state.voiceTranscript=e.target.value;$('#sendTranscript').onclick=()=>{const text=$('#transcript').value.trim();if(!text){notify('No transcript to send');return}state.draft=text;navigate('chat')};
 $('#browserSpeech').onclick=()=>{const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition){notify('Browser speech recognition is unavailable');return}const recognition=new Recognition();recognition.lang=navigator.language||'en-US';recognition.continuous=false;recognition.interimResults=false;recognition.onresult=e=>{$('#transcript').value=([...e.results].map(r=>r[0].transcript).join(' '))};recognition.onerror=e=>notify('Dictation error: '+e.error);recognition.start();notify('Browser dictation listening')};
}
function connectionsView(){const c=state.status?.provider||{kind:'none',model:'',base_url:''};return `<div class="page">${pageHeader('BRING YOUR OWN AI','AI Connections','Connect your own permitted model or local Ollama instance. The core interface works without a paid AI subscription.')}<div class="two-cols"><div class="surface"><div class="section-title">Provider configuration</div><form id="providerForm"><div class="form-field"><label>Connection type</label><select id="providerKind"><option value="none">Disconnected / Core only</option><option value="ollama">Ollama · Local model</option><option value="compatible">OpenAI-compatible API</option></select></div><div class="form-field"><label>Base URL</label><input id="providerURL" class="input" type="url" placeholder="https://api.openai.com/v1" value="${h(c.base_url||'')}"></div><div class="form-field"><label>Exact model ID</label><input id="providerModel" class="input" placeholder="Enter a model supported by your provider" value="${h(c.model||'')}"></div><div class="form-field"><label>API key · optional for local models</label><input id="providerKey" class="input" type="password" autocomplete="off" placeholder="Not saved to browser or disk"></div><button class="btn primary full">Connect provider</button></form><div class="setting-note spaced">Offline preview only. Provider connections are disabled, and no credentials are saved or sent. Use the full authenticated application for AI connections.</div></div><div class="grid-gap"><div class="surface"><div class="section-title">Connected capabilities</div><div class="mini-stats"><span class="stat"><strong>Chat:</strong> ${h(c.kind==='none'?'Not connected':c.model)}</span><span class="stat"><strong>Images:</strong> ${state.status?.comfy_ready?'ComfyUI configured':'Awaiting workflow'}</span><span class="stat"><strong>Audio:</strong> ${state.status?.audio_ready?'Transcription available':'No STT provider'}</span></div><div class="subtle-line"></div><h3>Provider support</h3><p class="subtitle">The full server version contains OpenAI-compatible and local Ollama adapters. Direct Claude/Gemini account sign-in and subscription reuse are <strong>not</strong> implemented in this version.</p></div><div class="surface"><div class="section-title">Automatic device capability</div><div class="mini-stats"><span class="stat">CPU threads: <strong>${device.cores||'unknown'}</strong></span><span class="stat">RAM hint: <strong>${device.ram?device.ram+' GB':'unavailable'}</strong></span><span class="stat">OffscreenCanvas: <strong>${device.offscreen?'yes':'no'}</strong></span><span class="stat">WebGPU: <strong>${device.webgpu?'available':'unavailable'}</strong></span></div><p class="caption spaced">This is a capability report, not a benchmark. Device-side image editing is active; remote generation requires a compatible model backend.</p></div></div></div></div>`}
function attachConnections(){const select=$('#providerKind');select.value=state.status?.provider?.kind||'none';const update=()=>{$('#providerURL').placeholder=select.value==='ollama'?'http://127.0.0.1:11434':'https://api.openai.com/v1'};update();select.onchange=update;$('#providerForm').onsubmit=async e=>{e.preventDefault();try{let p={kind:select.value,base_url:$('#providerURL').value.trim(),model:$('#providerModel').value.trim(),key:$('#providerKey').value};await api('/api/connections','POST',p);$('#providerKey').value='';state.status=await api('/api/status');notify(p.kind==='none'?'Provider disconnected':'Connection settings accepted; live inference is checked when you send a message');render()}catch(e){notify(e.message)}}}

 $('#nav').addEventListener('click',e=>{const btn=e.target.closest('[data-page]');if(btn)navigate(btn.dataset.page)});

 $('#mobileMenu').onclick=()=>{$('#sidebar').classList.add('open');$('#sidebarOverlay').classList.add('open')};$('#closeSidebar').onclick=closeMenu;$('#sidebarOverlay').onclick=closeMenu;
 refresh().then(render).catch(e=>{notify(e.message);render()});
