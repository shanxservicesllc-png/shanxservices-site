/* Electric blue IRIS: native CSS orb, no external image dependencies */
.composer .iris-orb-button{min-width:41px;width:41px;padding:0;display:flex;align-items:center;justify-content:center;border:1px solid #2799fa;background:#0b2143;box-shadow:0 0 12px #098dff55}

/* Browser-native ZIP creation: STORE format with CRC32, UTF-8 paths, no server required. */
function zipSafePath(path){
 const parts=String(path||'').replace(/\\/g,'/').split('/').map(p=>p.trim()).filter(Boolean);
 if(!parts.length||parts.some(p=>p==='.'||p==='..'||/[\x00-\x1f:]/.test(p)))return null;

}

 const base=dot>slash?safe.slice(0,dot):safe,ext=dot>slash?safe.slice(dot):'';
 for(let i=2;i<1000;i++){const proposed=base+'_version_'+i+ext;if(!seen.has(proposed)){seen.add(proposed);return proposed}}

}
function zipCrc(bytes){

  zipCrc.table=table;

 for(let i=0;i<bytes.length;i++)crc=table[(crc^bytes[i])&255]^(crc>>>8);

}

  b.setUint16(10,0,true);b.setUint16(12,time,true);b.setUint16(14,date,true);
  b.setUint32(16,crc,true);b.setUint32(20,length,true);b.setUint32(24,length,true);
  b.setUint16(28,filename.length,true);b.setUint16(30,0,true);b.setUint16(32,0,true);
  b.setUint16(34,0,true);b.setUint16(36,0,true);b.setUint32(38,0,true);b.setUint32(42,offset,true);

function extractGeneratedFileBlocks(messages){

 for(let index=0;index<messages.length;index++){
  const m=messages[index];if(m.role!=='assistant')continue;
  const text=String(m.content||'');

}

/* Native rich-format display, without changing raw messages or exports. */
function richInline(value){
 const stash=[];
 let t=h(String(value??''));
 t=t.replace(/\x60([^\x60\n]+)\x60/g,(_,contents)=>'\uE000'+(stash.push('<code class="inline-code">'+contents+'</code>')-1)+'\uE001');
 t=t.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
 t=t.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>');
 t=t.replace(/~~([^~\n]+)~~/g,'<del>$1</del>');
 t=t.replace(/\uE000(\d+)\uE001/g,(_,i)=>stash[Number(i)]||'');
 return t.replace(/\n/g,'<br>');
}
function richText(value){
 const lines=String(value??'').replace(/\r\n?/g,'\n').split('\n'),out=[];let i=0;
 const fenced=s=>/^\s*(\x60{3,}|~{3,})/.test(s);
 const block=s=>/^\s*(?:#{1,6}\s+|(?:#{1,6}\s*)?FILE START\s*:|[-+*]\s+|\d+[.)]\s+|>\s*|[-*_]{3,}\s*$)/i.test(s)||fenced(s);
 while(i<lines.length){
  const row=lines[i],v=row.trim();
  if(!v){i++;continue}
  const file=v.match(/^(?:#{1,6}\s*)?FILE START\s*:\s*(.+)$/i);
  if(file){
   let end=i+1;
   while(end<lines.length&&!/^\s*(?:#{1,6}\s*)?FILE END\s*$/i.test(lines[end]))end++;
   if(end<lines.length){
    const content=lines.slice(i+1,end).join('\n');
    out.push('<section class="rich-file-block"><div class="rich-file-head"><span class="rich-file-name">▣ '+h(file[1])+'</span><button type="button" class="rich-copy-btn" data-copy-file>⧉ Copy file</button></div><div class="rich-file-body">'+richText(content)+'</div><textarea hidden class="rich-file-source">'+h(content)+'</textarea></section>');
    i=end+1;continue;
   }
  }
  const f=row.match(/^\s*(\x60{3,}|~{3,})\s*([^\n]*)$/);
  if(f){
   i++;const body=[];while(i<lines.length&&!lines[i].trim().startsWith(f[1])){body.push(lines[i]);i++}
   if(i<lines.length)i++;
   out.push('<section class="rich-code-block"><div class="rich-code-head"><span>⌘ '+h(f[2].trim().slice(0,40)||'Code')+'</span><button type="button" class="rich-copy-btn" data-copy-code>⧉ Copy code</button></div><pre><code>'+h(body.join('\n'))+'</code></pre></section>');
   continue;
  }
  const heading=v.match(/^(#{1,6})\s+(.+)$/);
  if(heading){const level=Math.min(heading[1].length+1,6);out.push('<h'+level+'>'+richInline(heading[2])+'</h'+level+'>');i++;continue}
  if(/^[-*_]{3,}$/.test(v)){out.push('<hr>');i++;continue}
  if(/^\s*>\s*/.test(row)){
   const data=[];while(i<lines.length&&/^\s*>\s*/.test(lines[i]))data.push(lines[i++].replace(/^\s*>\s*/,''));out.push('<blockquote>'+richInline(data.join('\n'))+'</blockquote>');continue;
  }
  const unordered=/^\s*[-+*]\s+(.+)/.test(row),ordered=/^\s*\d+[.)]\s+(.+)/.test(row);
  if(unordered||ordered){
   const type=ordered?'ol':'ul',re=ordered?/^\s*\d+[.)]\s+(.+)/:/^\s*[-+*]\s+(.+)/;let result='<'+type+'>';
   while(i<lines.length){const m=lines[i].match(re);if(!m)break;result+='<li>'+richInline(m[1])+'</li>';i++}
   out.push(result+'</'+type+'>');continue;
  }
  if(row.includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1])){
   const cells=a=>a.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(v=>v.trim());
   let table='<div class="rich-table-wrap"><table><thead><tr>'+cells(row).map(t=>'<th>'+richInline(t)+'</th>').join('')+'</tr></thead><tbody>';i+=2;
   while(i<lines.length&&lines[i].trim()&&lines[i].includes('|'))table+='<tr>'+cells(lines[i++]).map(t=>'<td>'+richInline(t)+'</td>').join('')+'</tr>';
   out.push(table+'</tbody></table></div>');continue;
  }
  const p=[];
  while(i<lines.length&&lines[i].trim()&&(p.length===0||!block(lines[i]))){p.push(lines[i].trim());i++}
  if(p.length){out.push('<p>'+richInline(p.join('\n'))+'</p>')}
  else{out.push('<p>'+richInline(row)+'</p>');i++}
 }
 return '<div class="message-rich">'+out.join('')+'</div>';
}

function speechChunks(value){
 const text=String(value||'').trim(),chunks=[];let rest=text;
 while(rest.length>780){

  chunks.push(rest.slice(0,cut).trim());rest=rest.slice(cut).trimStart();

}

function focusComposerWith(text){
 const inp=$('#chatInput');
 if(!inp){notify('Open a conversation first');return}
 inp.value=String(text);inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);
 notify('Direction added to composer. Tap Send when ready.');
}
function continueFromReply(index,expand=false){
 const msg=state.messages[index];
 if(!msg||msg.role!=='assistant')return;
 const excerpt=String(msg.content||'').slice(0,5000);
 const instruction=expand?
  'Expand the following earlier X13 INFINITY answer into a more detailed, concrete result. Preserve established facts, do not repeat questions already answered, and identify any new assumptions:\n\n'+excerpt:
  'Continue from this earlier X13 INFINITY response, adding the next substantive section without repeating what is already written:\n\n'+excerpt;
 focusComposerWith(instruction);
}
async function branchFromReply(index){
 if(state.busy||chatSubmitLock){notify('Wait until the current response finishes before branching');return}
 const message=state.messages[index],original=currentChatDetails(),history=currentChatMessages();
 if(!message||!original){notify('Save this conversation before branching');return}
 const idx=history.findIndex(m=>m.id===message.id);
 if(idx<0){notify('This message must be saved before branching');return}
 const branchId=offlineId();
 const branch={id:branchId,title:'Branch: '+String(original.title||'Conversation').slice(0,62),
  project_id:original.project_id||null,branched_from:{chat_id:original.id,message_id:message.id,created_at:new Date().toISOString()}};
 offlineDB.chats.push(branch);
 offlineDB.messages[branchId]=history.slice(0,idx+1).map(m=>({...m,source_message_id:m.id,id:offlineId()}));
 saveOffline();
 stopSpokenReply();
 await refresh();await openChat(branchId);
 notify('Branch created. Original conversation preserved.');
}

 $$('[data-expand-message]').forEach(b=>b.onclick=()=>continueFromReply(Number(b.dataset.expandMessage),true));
 $$('[data-branch-message]').forEach(b=>b.onclick=()=>branchFromReply(Number(b.dataset.branchMessage)));
}

let chatRecognition=null;
function setChatMicActive(active){
 const button=$('#dictateShortcut');
 if(button){button.classList.toggle('listening',active);button.setAttribute('aria-pressed',String(active));button.textContent=active?'■':'🎤'}
 const status=$('#dictationStatus');
 if(status)status.textContent=active?'🎤 Listening. Tap mic to stop. Your words stay in the chat box.':(state.status?.provider?.connected?'Connected model: '+state.status.provider.model:'No AI provider selected · Connect one in AI Connections to receive real responses');
}
function stopChatDictation(cancel=false){
 const recognition=chatRecognition;state.dictating=false;
 if(recognition){try{if(cancel){chatRecognition=null;recognition.abort()}else recognition.stop()}catch{chatRecognition=null}}
 setChatMicActive(false);
}
function startChatDictation(input){
 if(chatRecognition){stopChatDictation(false);return}
 const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!Recognition){notify('Speech-to-text is unavailable in this browser. Try Chrome or the keyboard microphone.');return}
 const recognition=new Recognition();
 const previous=input.value.trimEnd();
 recognition.lang=navigator.language||'en-US';recognition.continuous=false;recognition.interimResults=true;
 recognition.onresult=event=>{
  if(chatRecognition!==recognition)return;
  const transcript=Array.from(event.results,part=>part[0]?.transcript||'').join(' ').trim();
  input.value=previous+(previous&&transcript?' ':'')+transcript;
 };
 recognition.onerror=event=>{if(chatRecognition===recognition)notify('Dictation: '+(event.error||'microphone error'))};
 recognition.onend=()=>{if(chatRecognition===recognition){chatRecognition=null;state.dictating=false;setChatMicActive(false)}};
 try{recognition.start();chatRecognition=recognition;state.dictating=true;setChatMicActive(true);input.focus()}
 catch(error){chatRecognition=null;state.dictating=false;setChatMicActive(false);notify('Could not start dictation: '+error.message)}
}


function quickModelOptions(){
 const selected=String(state.config.chatModel),all=state.modelCatalog||[];
 const free=all.filter(modelFree).sort((a,b)=>modelContext(b)-modelContext(a)).slice(0,7);
 const strong=shortlistModels(all).slice(0,20),seen=new Set();
 let options='<option value="'+h(selected)+'">'+h((all.find(m=>modelKey(m)===selected||m.id===selected)||{}).name||selected)+'</option>';
 seen.add(selected);
 for(const m of [...free,...strong]){
  const key=modelKey(m);if(!key||seen.has(key))continue;seen.add(key);
  options+='<option value="'+h(key)+'">'+h(modelName(m))+(modelFree(m)?' · free variant':'')+'</option>';
  if(seen.size>=26)break;
 }
 return options+'<option value="__model_lab__">Browse entire catalog…</option>';
}
function quickModelInfo(){
 const m=(state.modelCatalog||[]).find(v=>modelKey(v)===state.config.chatModel||v.id===state.config.chatModel);
 if(!m)return state.modelCatalogError||'Current model selected; catalog information loading';
 return 'Context '+formatTokens(modelContext(m))+' · Output '+formatTokens(modelOutput(m))+' · '+modelPrice(m)+(modelFree(m)?' · free variant, quota dependent':'');
}

async function newChat(open=true){try{const c=await api('/api/chats','POST',{title:'New conversation',project_id:state.project});await refresh();if(open)await openChat(c.id);return c.id}catch(e){notify(e.message)}}

let liveResponseController=null,steerDraft=null;
function stopLiveResponse(){
 if(liveResponseController&&state.busy)liveResponseController.abort();
 const status=$('#streamStatus');if(status)status.textContent='Stopping visible reply…';
}
function bindResponseActions(){
 const stop=$('#streamStop');if(stop)stop.onclick=()=>{stopLiveResponse();notify('Output stop requested. Puter may still bill for the request.')};
 const steer=$('#streamSteer');if(steer)steer.onclick=()=>{const panel=$('#steerPanel');if(panel){panel.hidden=!panel.hidden;if(!panel.hidden)$('#steerInstruction')?.focus()}};
 const apply=$('#applySteer');if(apply)apply.onclick=()=>{const input=$('#steerInstruction')?.value.trim();if(!input){notify('Enter a direction first');return}steerDraft=input;stopLiveResponse()};
}

function attachChat(){
 attachQuickModelBar();
 bindResponseActions();
 $$('[data-jump]').forEach(b=>b.onclick=()=>navigate(b.dataset.jump));
 $('#imageShortcut').onclick=()=>navigate('images');$('#voiceShortcut').onclick=()=>navigate('voice');$('#dictateShortcut').onclick=()=>startChatDictation($('#chatInput'));
 $$('[data-copy-message]').forEach(btn=>btn.onclick=()=>{const message=state.messages[Number(btn.dataset.copyMessage)];if(message)copyChatText(message.content)});
 attachReplyActions();
 $$('[data-copy-code]').forEach(b=>b.onclick=()=>copyChatText(b.closest('.rich-code-block')?.querySelector('pre code')?.textContent||''));
 $$('[data-copy-file]').forEach(b=>b.onclick=()=>copyChatText(b.closest('.rich-file-block')?.querySelector('.rich-file-source')?.value||''));
 const copyAll=$('#copyChatAll');if(copyAll)copyAll.onclick=()=>currentChatMessages().length?copyChatText(makeChatTranscript()):notify('No messages to copy yet');
 const txt=$('#exportChatTxt');if(txt)txt.onclick=()=>exportChat('txt');
 const json=$('#exportChatJson');if(json)json.onclick=()=>exportChat('json');
 const zip=$('#exportChatZip');if(zip)zip.onclick=()=>exportMyChatZip('chat');
 const inp=$('#chatInput');if(state.draft){inp.value=state.draft;state.draft=''}
 inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#chatForm').requestSubmit()}});
 $('#chatForm').onsubmit=async(e)=>{
  e.preventDefault();
  if(chatSubmitLock||state.busy)return;
  const text=inp.value.trim();if(!text)return;
  chatSubmitLock=true;state.busy=true;
  const requestId=offlineId();let chatId=null,controller=null;
  try{
   if(chatRecognition)stopChatDictation(false);
   if(window.puter?.auth?.signIn&&!puter.auth.isSignedIn()){
    try{await puter.auth.signIn();state.status=await api('/api/status')}
    catch(error){notify('AI sign-in required: '+(error?.message||String(error)));return}
   }
   state.chatError='';
   chatId=state.currentChat||await newChat(false);
   if(!chatId)return;
   state.currentChat=chatId;inp.value='';
   state.messages=await api('/api/chats/'+encodeURIComponent(chatId)+'/messages');
   controller=new AbortController();liveResponseController=controller;
   const streamId='stream-'+requestId;
   state.messages.push({id:'pending-'+requestId,role:'user',content:text,created_at:new Date().toISOString()});
   state.messages.push({id:streamId,role:'assistant',content:'Thinking…',created_at:new Date().toISOString()});
   render();scrollMessages();
   const result=await api('/api/chat/send','POST',{chat_id:chatId,message:text,client_request_id:requestId,signal:controller.signal,onChunk:content=>{
    const m=state.messages.find(x=>x.id===streamId);if(m)m.content=content;
    if(state.page==='chat'&&state.currentChat===chatId){
     const bubbles=$$('.message.assistant .message-bubble'),bubble=bubbles[bubbles.length-1];
     if(bubble){bubble.innerHTML=richText(content);scrollMessages()}
    }
   }});
   if(state.currentChat===chatId)state.messages=await api('/api/chats/'+encodeURIComponent(chatId)+'/messages');
   if(!result.answered&&!result.stopped&&!result.duplicate)state.chatError=result.error||'AI did not answer';
   else if(result.answered||result.stopped)state.chatError='';
   state.chats=await api('/api/chats');
  }catch(error){state.chatError='Message error: '+(error?.message||String(error));notify(state.chatError)}
  finally{
   if(liveResponseController===controller)liveResponseController=null;
   chatSubmitLock=false;state.busy=false;
   const direction=steerDraft;steerDraft=null;
   render();scrollMessages();
   if(direction&&state.page==='chat'&&state.currentChat===chatId){
    const editor=$('#chatInput');if(editor){editor.value=direction;editor.focus();notify('Direction ready. Review and press Send when ready.')}
   }
  }
 };

}

async function transcribeRecordedAudio(blob,token){

 if(status)status.textContent='Transcribing your recording through your AI account...';
 try{
  const result=await puter.ai.speech2txt(blob);
  if(token!==state.voiceToken)return;
  const text=typeof result==='string'?result:(result?.text||result?.transcript||'');
  state.voiceTranscript=String(text||'');
  const input=$('#transcript');if(input)input.value=state.voiceTranscript;
  if(status)status.textContent=state.voiceTranscript?'Transcript ready. Play, edit, send, download or erase.':'No speech detected. Audio playback remains available.';

}

  if(state.mediaRecorder?.state==='recording'){stopRecording();return}
  if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){notify('Audio recording is not supported in this browser');return}
  let stream;
  try{
   stream=await navigator.mediaDevices.getUserMedia({audio:true});
   const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>MediaRecorder.isTypeSupported(t));
   const recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
   if(state.voiceObjectUrl)URL.revokeObjectURL(state.voiceObjectUrl);

/* Model Lab reads only the provider's current catalog, not fabricated model IDs. */
function modelName(m){return String(m.name||m.id||m.puterId||'Unknown model')}
function modelKey(m){return String(m.puterId||m.id||'')}
function modelContext(m){const x=Number(m.context);return Number.isFinite(x)&&x>0?x:0}
function modelOutput(m){const x=Number(m.max_tokens);return Number.isFinite(x)&&x>0?x:0}
function formatTokens(n){if(!n)return 'unknown';return n>=1000000?(Number(n/1000000).toFixed(n%1000000?1:0)+'M'):n>=1000?(Number(n/1000).toFixed(n%1000?1:0)+'K'):String(n)}
function modelFree(m){return /:free(?:$|\b)/i.test(modelKey(m))||/:free(?:$|\b)/i.test(String(m.id||''))}
function modelPrice(m){
 const c=m.cost;if(!c||c.currency!=='usd-cents'||!(Number(c.tokens)>0))return 'Price unknown';
 const t=Number(c.tokens),i=Number(c.input),o=Number(c.output);
 if(!Number.isFinite(i)||!Number.isFinite(o))return 'Price unknown';
 const dollar=v=>(v*10000/t).toFixed(v*10000/t<1?3:2);
 return '$'+dollar(i)+' in / $'+dollar(o)+' out per 1M tokens';
}
function shortlistModels(models){
 const eligible=models.filter(m=>modelContext(m)>=128000&&modelOutput(m)>=8000);
 const sorted=[...eligible].sort((a,b)=>modelContext(b)-modelContext(a)||modelOutput(b)-modelOutput(a));
 const picks=[],counts=new Map();
 for(const model of sorted){
  const provider=String(model.provider||'unknown');
  if((counts.get(provider)||0)>=2)continue;
  picks.push(model);counts.set(provider,(counts.get(provider)||0)+1);
  if(picks.length>=20)break;
 }
 for(const model of sorted){if(picks.length>=20)break;if(!picks.includes(model))picks.push(model)}
 return picks;
}
async function loadModelCatalog(force=false){

 if(!window.puter?.ai?.listModels){state.modelCatalogError='Puter model catalog API unavailable in this browser';state.modelLoaded=false;if(state.page==='models')render();return}
 state.modelLoading=true;state.modelCatalogError='';
 if(state.page==='models')render();
 try{
  const result=await puter.ai.listModels();
  if(!Array.isArray(result))throw Error('Provider returned an invalid model catalog');
  state.modelCatalog=result.filter(m=>m&&typeof m==='object'&&typeof m.id==='string'&&m.id.trim());
  state.modelLoaded=true;state.modelCatalogError='';
 }catch(error){state.modelCatalogError='Cannot load model catalog: '+(error?.message||String(error));state.modelLoaded=false}
 finally{state.modelLoading=false;if(state.page==='models')render();else if(state.page==='chat')refreshQuickModelBar()}
}
function visibleModels(){
 let all=[...state.modelCatalog],filter=state.modelFilter,query=state.modelQuery.trim().toLowerCase();
 if(filter==='featured')all=shortlistModels(all);
 else if(filter==='free')all=all.filter(modelFree).sort((a,b)=>modelContext(b)-modelContext(a)||modelOutput(b)-modelOutput(a));
 else if(filter==='context')all=all.filter(m=>modelContext(m)>=200000).sort((a,b)=>modelContext(b)-modelContext(a)||modelOutput(b)-modelOutput(a));
 else if(filter==='output')all=all.filter(m=>modelOutput(m)>=16000).sort((a,b)=>modelOutput(b)-modelOutput(a)||modelContext(b)-modelContext(a));
 else all.sort((a,b)=>modelContext(b)-modelContext(a)||modelOutput(b)-modelOutput(a));
 if(query)all=all.filter(m=>(modelName(m)+' '+modelKey(m)+' '+String(m.provider||'')).toLowerCase().includes(query));
 return all.slice(0,60);
}

  '<p class="caption spaced">'+(state.modelLoading?'Loading current provider models…':state.modelCatalogError?h(state.modelCatalogError):'Metadata is supplied by Puter. Context, output and prices may change. Unknown means the provider did not supply a verified value.')+'</p>'+
  '<div class="model-lab-controls"><div class="form-field"><label>Browse models</label><select id="modelFilter">'+menu+'</select></div><div class="form-field"><label>Search name / ID / provider</label><input class="input" id="modelSearch" placeholder="Search the model catalog..." value="'+h(state.modelQuery)+'"></div><button id="modelSearchButton" class="btn gold">Find</button></div>'+
  '<p class="caption spaced">'+items.length+' models shown. Featured means large context/output and provider variety, not a claim of intelligence ranking.</p><div class="model-list">'+(cards||'<div class="empty-card">No matching models. Refresh or try another filter.</div>')+'</div></div>'+
  '<div class="surface spaced"><h3>Two-model comparison</h3><p class="subtitle">Choose Compare A and Compare B on model cards. Each test sends your prompt to both real models and uses your own account allowance or paid credits.</p>'+
  '<div class="mini-stats"><div class="stat"><strong>A:</strong> '+h(a?modelName(a):'Not selected')+'</div><div class="stat"><strong>B:</strong> '+h(b?modelName(b):'Not selected')+'</div></div>'+
  '<div class="form-field spaced"><label>Test prompt</label><textarea id="comparePrompt" rows="4" maxlength="8000">'+h(state.comparePrompt)+'</textarea></div>'+
  '<button id="runModelComparison" class="btn primary"'+(state.comparing||!a||!b?' disabled':'')+'>'+(state.comparing?'Running both models…':'▶ Compare models (uses credits)')+'</button>'+results+
  '</div></div>';
}
function attachModelLab(){
 const filter=$('#modelFilter');if(filter){filter.value=state.modelFilter;filter.onchange=e=>{state.modelFilter=e.target.value;render()}}
 const search=$('#modelSearch');
 if(search)search.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();state.modelQuery=search.value.trim();render()}};
 const find=$('#modelSearchButton');if(find)find.onclick=()=>{state.modelQuery=$('#modelSearch').value.trim();render()};
 const refresh=$('#modelRefresh');if(refresh)refresh.onclick=()=>loadModelCatalog(true);
 $$('[data-model-use]').forEach(btn=>btn.onclick=async()=>{
  const m=state.modelCatalog.find(x=>modelKey(x)===btn.dataset.modelUse);if(!m)return;
  state.config.chatModel=modelKey(m);offlineDB.settings={...(offlineDB.settings||{}),chatModel:state.config.chatModel};saveOffline();
  state.status=await api('/api/status');notify('Chat model selected: '+modelName(m));render();
 });
 $$('[data-model-a]').forEach(btn=>btn.onclick=()=>{state.compareA=btn.dataset.modelA;state.compareResults=null;render()});
 $$('[data-model-b]').forEach(btn=>btn.onclick=()=>{state.compareB=btn.dataset.modelB;state.compareResults=null;render()});
 const prompt=$('#comparePrompt');if(prompt)prompt.oninput=e=>state.comparePrompt=e.target.value;
 const run=$('#runModelComparison');
 if(run)run.onclick=async()=>{
  if(state.comparing||!state.compareA||!state.compareB)return;
  const promptText=$('#comparePrompt').value.trim();if(!promptText){notify('Enter a comparison prompt');return}
  state.comparePrompt=promptText;
  if(!window.puter?.ai?.chat){notify('Provider chat API unavailable');return}
  if(window.puter?.auth?.signIn&&!puter.auth.isSignedIn()){try{await puter.auth.signIn()}catch(e){notify('Sign-in canceled: '+(e?.message||String(e)));return}}
  state.comparing=true;state.compareResults=null;render();
  const request=async(id)=>{
   try{
    const response=await puter.ai.chat(promptText,{model:id,normalize:true});
    const body=response?.message?.content??response?.content??'';
    return typeof body==='string'?body:Array.isArray(body)?body.filter(x=>x?.type==='text').map(x=>x.text).join('\n'):'No text returned';
   }catch(e){return 'Model error: '+(e?.message||String(e))}
  };
  const [a,b]=await Promise.all([request(state.compareA),request(state.compareB)]);
  state.compareResults={a,b};state.comparing=false;
  if(state.page==='models')render();
 };
}

function connectionsView(){
 const sdk=!!window.puter?.ai;const signed=!!window.puter?.auth?.isSignedIn?.();
 const label=signed?'Connected to Puter AI':sdk?'Ready for sign-in':'AI script not loaded';
 const status='<span class="provider-indicator">'+h(label)+'</span>';
 return '<div class="page">'+pageHeader('BRING YOUR OWN AI','AI Connections','X13 INFINITY uses a real AI provider without embedding private API keys in a public website.')+
 '<div class="two-cols"><div class="surface"><div class="section-title">Puter AI Account</div><p class="subtitle">Sign in to your own Puter account. Chat, AI images and voice transcription use that account and its available allowance or credits.</p><p>'+status+'</p>'+
 '<div class="form-row spaced"><button type="button" class="btn primary" id="puterConnect">✦ Connect Puter AI</button><button type="button" class="btn quiet" id="puterDisconnect">Disconnect Puter</button></div>'+
 '<div class="subtle-line"></div><div class="form-field"><label>Chat model ID</label><input id="chatModelInput" class="input" type="text" maxlength="100" value="'+h(state.config.chatModel)+'"></div><button id="saveChatModel" class="btn gold">Save model selection</button>'+
 '<div class="subtle-line"></div><div class="form-field"><label>Read Aloud voice (browser, no Puter credits)</label><select class="input" id="readingVoiceSetting" aria-label="Browser reading voice">'+browserVoiceOptions()+'</select></div><div class="form-field"><label>Reading speed</label><select class="input" id="speechRateSetting"><option value="0.85">Relaxed · 0.85×</option><option value="1">Normal · 1×</option><option value="1.15">Fast · 1.15×</option></select></div><p class="caption">Voice and speed are remembered in this browser. Available voices depend on your device. No separate Puter speech request is made.</p>'+'<p class="caption spaced">Default: gpt-5.4-nano. If you enter another model ID, it must be supported by your Puter account. The provider may request payment for usage beyond its allowance.</p></div>'+
 '<div class="grid-gap"><div class="surface"><div class="section-title">Live capabilities</div><div class="mini-stats"><span class="stat"><strong>Chat:</strong> '+(sdk?'Provider API loaded':'Offline')+'</span><span class="stat"><strong>Images:</strong> '+(!!window.puter?.ai?.txt2img?'Cloud models available':'Unavailable')+'</span><span class="stat"><strong>Transcription:</strong> '+(!!window.puter?.ai?.speech2txt?'Provider supported':'Unavailable')+'</span></div>'+
 '<p class="caption spaced">Automatic sign-in can also occur when you send a message, generate an image or request a transcript.</p></div>'+
 '<div class="surface"><div class="section-title">Current device</div><div class="mini-stats"><div class="stat">CPU threads: '+h(device.cores||'unknown')+'</div><div class="stat">WebGPU: '+(device.webgpu?'supported':'unavailable')+'</div><div class="stat">Canvas worker: '+(device.offscreen?'supported':'unavailable')+'</div></div>'+
 '<p class="caption spaced">Edits, local image storage and recording playback run in this browser. Generative models currently run through your connected provider; a separate compatible runtime is required for on-device AI generation.</p></div></div></div></div>';
}
function attachConnections(){
 const voice=$('#readingVoiceSetting'),speed=$('#speechRateSetting');
 if(voice){
  voice.onchange=e=>{offlineDB.settings={...(offlineDB.settings||{}),browserVoiceURI:e.target.value};saveOffline();notify('Browser reading voice saved')};
  const updateVoices=()=>{if(state.page==='connections'&&$('#readingVoiceSetting'))$('#readingVoiceSetting').innerHTML=browserVoiceOptions()};
  if(browserSpeechReady())window.speechSynthesis.onvoiceschanged=updateVoices;
 }
 if(speed){
  speed.value=String(offlineDB.settings?.speechRate||1);
  speed.onchange=e=>{offlineDB.settings={...(offlineDB.settings||{}),speechRate:Number(e.target.value)||1};saveOffline();notify('Reading speed saved')};
 }
 $('#puterConnect').onclick=async()=>{
  if(!window.puter?.auth?.signIn){notify('Puter SDK unavailable. Check internet and reload.');return}
  try{await puter.auth.signIn();state.status=await api('/api/status');notify(state.status?.provider?.connected?'Puter AI connected':'Sign-in did not complete');render()}catch(err){notify('Sign-in failed: '+(err?.message||String(err)))}
 };
 $('#puterDisconnect').onclick=async()=>{
  if(!window.puter?.auth?.signOut)return;
  try{await puter.auth.signOut();state.status=await api('/api/status');notify('Puter account disconnected');render()}catch(err){notify('Disconnect error: '+(err?.message||String(err)))}
 };
 $('#saveChatModel').onclick=async()=>{
  const model=$('#chatModelInput').value.trim();
  if(!model||model.length>100){notify('Enter a valid model ID');return}
  state.config.chatModel=model;offlineDB.settings={...(offlineDB.settings||{}),chatModel:model};saveOffline();
  state.status=await api('/api/status');notify('Chat model set to '+model);render();
 };
}

function init(){
 $('#nav').addEventListener('click',e=>{const btn=e.target.closest('[data-page]');if(btn)navigate(btn.dataset.page)});
 $('#newChat').onclick=()=>{state.currentChat=null;state.messages=[];state.chatError='';navigate('chat');$('#chatInput')?.focus()};
 $('#refreshChats').onclick=async()=>{await refresh();render();notify('Refreshed')};
 $('#openSettings').onclick=()=>navigate('connections');$('#topConnections').onclick=()=>navigate('connections');
 $('#mobileMenu').onclick=()=>{$('#sidebar').classList.add('open');$('#sidebarOverlay').classList.add('open')};$('#closeSidebar').onclick=closeMenu;$('#sidebarOverlay').onclick=closeMenu;
 restoreImageRecords().then(refresh).then(render).catch(e=>{notify(e.message);render()});
}
window.addEventListener('DOMContentLoaded',init);
</script>
