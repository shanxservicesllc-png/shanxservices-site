<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>ShanX Streets Homewood | Aerial Reference & Street Survey</title><meta name="theme-color" content="#071c16">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css">
<style>
*{box-sizing:border-box}html,body,#map{margin:0;height:100%;width:100%;overflow:hidden;font:14px system-ui;color:#e5ffef;background:#061813}body{touch-action:none}#map{position:fixed;inset:0}
#shade{position:fixed;inset:0;pointer-events:none;background:linear-gradient(#041a12b9,transparent 24%,transparent 74%,#03150faf)}
#head{position:fixed;left:10px;right:10px;top:max(9px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:8px;pointer-events:none}
#head>div{background:#061e19dd;border:1px solid #54b98c72;padding:9px 12px;border-radius:11px;backdrop-filter:blur(10px)}#head b{font-size:clamp(15px,4vw,22px)}#head small{display:block;color:#74e8ae;font-weight:700;letter-spacing:.08em;font-size:10px}#mode{font-size:11px;max-width:190px;text-align:right;color:#d5e4de}
#toolbar{position:fixed;left:10px;top:83px;display:flex;gap:6px;flex-wrap:wrap}button{color:#eaffef;background:#103d2ddd;border:1px solid #65c69a77;touch-action:none;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid white;outline-offset:2px}.pill{border-radius:30px;padding:10px 12px;font-size:12px;font-weight:750}.pill.active{background:#238d61;border-color:#b5ffca}
#panel{position:fixed;left:10px;top:170px;max-width:min(360px,calc(100vw - 20px));max-height:48vh;overflow:auto;border-radius:11px;background:#071e18f5;border:1px solid #49a67f90;padding:13px;line-height:1.55;display:none;box-shadow:0 16px 30px #0008}#panel.open{display:block}#panel h2{color:#9cf3c7;font-size:16px;margin:0 0 6px}#panel p{margin:6px 0 11px}#panel a{color:#98ffce}#panel small{color:#adccc0}
#help{position:fixed;bottom:max(11px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:97vw;width:600px;border-radius:9px;background:#061f1ade;border:1px solid #5eaf88aa;padding:8px;text-align:center;font-size:11px}
#walk{display:none;position:fixed;inset:0;pointer-events:none}#walk.show{display:block}#look{position:absolute;right:0;top:23%;bottom:20%;width:52%;pointer-events:auto;touch-action:none}#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#e6fff5ba;font-size:22px;text-shadow:0 1px 6px black}
#dpad{position:absolute;bottom:max(63px,env(safe-area-inset-bottom) + 59px);left:12px;pointer-events:auto;display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:5px}#dpad button{border-radius:13px;font-size:23px;font-weight:850;background:#10372edb}#dpad button.down{background:#2aa375}#dpad button[data-k="KeyW"]{grid-area:1/2}#dpad button[data-k="KeyA"]{grid-area:2/1}#dpad button[data-k="KeyS"]{grid-area:2/2}#dpad button[data-k="KeyD"]{grid-area:2/3}
#run{position:absolute;right:12px;bottom:max(83px,env(safe-area-inset-bottom) + 68px);width:70px;height:70px;border-radius:50%;pointer-events:auto;font-size:11px;font-weight:800;background:#194b37da}
#coords{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));right:8px;font-size:11px;padding:6px;background:#061b18dc;border-radius:7px;max-width:72%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid #68c597;background:#071e19f5;border-radius:13px;padding:18px;text-align:center;line-height:1.5;min-width:220px;max-width:80vw}#loading small{display:block;color:#c4ded0;margin-top:8px}#loading[hidden],#coords[hidden],#help[hidden]{display:none}
@media(max-width:540px){#head{left:5px;right:5px}#head>div{padding:7px}#head b{font-size:16px}#mode{max-width:120px;font-size:10px}#toolbar{top:76px;left:5px;right:4px}.pill{font-size:11px;padding:8px 9px}#panel{top:166px;left:5px}#help{font-size:10px;padding:6px}}
</style></head><body>
<div id="map" aria-label="3D map of real Homewood streets"></div><div id="shade"></div>
<div id="loading"><b>SHANX STREETS · HOMEWOOD</b><small>Loading mapped streets and buildings…</small></div>
<div id="head"><div><small>SXS INTERACTIVE · LOCATION LAB</small><b>SHANX STREETS <span style="color:#63e3a4">/ HOMEWOOD</span></b></div><div id="mode">3D NEIGHBORHOOD SURVEY<br>Real street map geometry</div></div>
<div id="toolbar"><button class="pill" id="skyview">🛰️ Aerial</button><button class="pill active" id="survey">🗺️ 3D Blocks</button><button class="pill" id="street">🚶 Street Walk</button><button class="pill" id="reset">↺ Reset</button><button class="pill" id="missions">◇ Missions</button><button class="pill" id="proof">ⓘ Proof</button><button class="pill" id="streetPhoto">📷 Real Street View ↗</button></div>
<div id="panel" aria-live="polite"></div>
<div id="walk"><div id="cross">+</div><div id="look" aria-label="Drag here to look around"></div><div id="dpad"><button data-k="KeyW">↑</button><button data-k="KeyA">↶</button><button data-k="KeyS">↓</button><button data-k="KeyD">↷</button></div><button id="run">RUN</button></div>
<div id="help">REAL AERIAL REFERENCE · Photo rooflines and streets · Not yet textured 3D gameplay</div><div id="coords" hidden></div>
<script type="module">
import * as ml from 'https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.mjs';
const ORIGIN=[-79.8929402,40.4568844]; // 7321 Frankstown Avenue per City of Pittsburgh
const M=ml.MercatorCoordinate.fromLngLat(ORIGIN),scale=M.meterInMercatorCoordinateUnits();
const player={x:0,y:0,a:Math.PI,p:0,run:false},keys=new Set();
const ll=(x,y)=>new ml.MercatorCoordinate(M.x+x*scale,M.y-y*scale).toLngLat();
const $=s=>document.getElementById(s);
let mode='survey',ready=false,last=performance.now(),drag=null;
const map=new ml.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:ORIGIN,zoom:17.2,pitch:62,bearing:-22,maxPitch:95,centerClampedToGround:false,canvasContextAttributes:{antialias:true}});
const texts={
 missions:'<h2>Optional mission modules</h2><p>Freely explore even if you never start a mission.</p><p><b>Research concepts:</b> neighborhood cleanup, community celebration, a small-business delivery, and crosswalk improvements.</p><p>These are future fictional mission outlines, not playable missions yet. Public events may inspire stories; private residents will not be identified without permission.</p>',
 proof:'<h2>Proof Before Next · Gate 1</h2><p><b>Aerial mode:</b> Esri World Imagery. This displays photographs of actual roofs, lots and roads, NOT downloadable or reusable game textures. Street View opens official Google Maps separately for visual inspection. <b>Real in-game houses are still missing.</b></p><p><b>Built:</b> Real neighborhood roads, mapped 3D building footprints, overhead 3D inspection, and a movable first-person street camera using a proven MapLibre map engine.</p><p><b>Not built:</b> visible rigged pedestrian, physical collisions, doors/seats, drivable cars, AI pedestrians, authentic facades, full mission gameplay.</p><p><b>Important:</b> this street camera can move through structures. It is geography inspection, not a passing game/physics prototype.</p><p><small>Maps: OpenStreetMap / <a href="https://openfreemap.org/" target="_blank" rel="noopener">OpenFreeMap</a>. Building heights are dependent on available map data. No proprietary Google 3D meshes used. Original Unreal project untouched.</small></p>'
};
function pane(name){const p=$('panel'),same=p.classList.contains('open')&&p.dataset.name===name;p.classList.toggle('open',!same);p.dataset.name=name;if(!same)p.innerHTML=texts[name];}
$('missions').onclick=()=>pane('missions');$('proof').onclick=()=>pane('proof');
function addBuildings(){try{let source='openmaptiles';if(!map.getSource(source)){source='sxs-vector';map.addSource(source,{type:'vector',url:'https://tiles.openfreemap.org/planet'});}const label=map.getStyle().layers.find(x=>x.type==='symbol'&&x.layout?.['text-field'])?.id;
map.addLayer({id:'sxs-3d-buildings',type:'fill-extrusion',source,'source-layer':'building',minzoom:14.5,filter:['!=',['get','hide_3d'],true],paint:{'fill-extrusion-color':['interpolate',['linear'],['coalesce',['get','render_height'],8],0,'#bca991',15,'#a5aa99',50,'#567a68'],'fill-extrusion-height':['interpolate',['linear'],['zoom'],14.5,0,15.4,['max',4,['coalesce',['get','render_height'],9]]],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':.92}},label);
}catch(e){console.warn('3D extrusion issue',e);}}
function camera(){if(!ready||mode!=='walk')return;const eye=ll(player.x,player.y),ahead=ll(player.x+Math.cos(player.a)*18,player.y+Math.sin(player.a)*18);map.jumpTo(map.calculateCameraOptionsFromTo(eye,1.7,ahead,1.7+Math.tan(player.p)*18));}
function setMode(v){if(!ready)return;mode=v;keys.clear();$('skyview').classList.toggle('active',v==='aerial');$('survey').classList.toggle('active',v==='survey');if(map.getLayer('sxs-aerial'))map.setLayoutProperty('sxs-aerial','visibility',v==='aerial'?'visible':'none');if(map.getLayer('sxs-3d-buildings'))map.setLayoutProperty('sxs-3d-buildings','visibility',v==='aerial'?'none':'visible');$('street').classList.toggle('active',v==='walk');$('walk').classList.toggle('show',v==='walk');$('help').hidden=v==='walk';$('help').textContent=v==='aerial'?'ACTUAL AERIAL IMAGERY · Visible rooftops, streets, yards and lots; reference only':'GEOGRAPHY PROOF · 3D footprints are NOT game-ready house models';$('coords').hidden=v!=='walk';$('mode').innerHTML=v==='walk'?'EYE-HEIGHT STREET WALK<br>WASD / touch · Drag to look':v==='aerial'?'REAL AERIAL PHOTO VIEW<br>Inspect real rooftops and lots':'3D NEIGHBORHOOD SURVEY<br>Building footprints, not houses';if(v==='walk'){map.dragPan.disable();map.dragRotate.disable();map.scrollZoom.disable();map.touchZoomRotate.disable();map.doubleClickZoom.disable();map.keyboard.disable();camera();}else{map.dragPan.enable();map.dragRotate.enable();map.scrollZoom.enable();map.touchZoomRotate.enable();map.doubleClickZoom.enable();map.jumpTo({center:ll(player.x,player.y),zoom:v==='aerial'?18.1:17.2,pitch:v==='aerial'?48:62,bearing:-22});}}
$('survey').onclick=()=>setMode('survey');$('street').onclick=()=>setMode('walk');$('skyview').onclick=()=>setMode('aerial');$('streetPhoto').onclick=()=>{const p=mode==='walk'?ll(player.x,player.y):map.getCenter();const u='https://www.google.com/maps/@?api=1&map_action=pano&viewpoint='+p.lat.toFixed(7)+','+p.lng.toFixed(7);window.open(u,'_blank','noopener,noreferrer')};
$('reset').onclick=()=>{player.x=0;player.y=0;player.a=Math.PI;player.p=0;keys.clear();if(mode==='walk')camera();else map.flyTo({center:ORIGIN,zoom:17.2,pitch:62,bearing:-22});};
map.on('load',()=>{ready=true;addBuildings();map.addSource('sxs-aerial-source',{type:'raster',tiles:['https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:19,attribution:'Imagery © Esri, Maxar, Earthstar Geographics and the GIS User Community'});const l=map.getStyle().layers.find(x=>x.type==='symbol')?.id;map.addLayer({id:'sxs-aerial',type:'raster',source:'sxs-aerial-source',paint:{'raster-opacity':1}},l);$('loading').hidden=true;setMode('aerial')});
map.on('error',e=>{console.warn('Map loading issue',e.error);if(!ready)$('loading').innerHTML='<b>MAP DATA UNAVAILABLE</b><small>Network access to OpenFreeMap is required. Reconnect and reload.</small>'});
addEventListener('keydown',e=>{if(mode!=='walk')return;if(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','ShiftLeft','ShiftRight'].includes(e.code)){e.preventDefault();keys.add(e.code)}});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>keys.clear());
for(const b of document.querySelectorAll('[data-k]')){const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k);b.classList.add('down')});for(const ev of ['lostpointercapture','pointerup','pointercancel'])b.addEventListener(ev,()=>{keys.delete(k);b.classList.remove('down')});}
$('run').addEventListener('pointerdown',e=>{e.preventDefault();e.currentTarget.setPointerCapture(e.pointerId);player.run=true});for(const ev of ['lostpointercapture','pointerup','pointercancel'])$('run').addEventListener(ev,()=>player.run=false);
$('look').addEventListener('pointerdown',e=>{e.preventDefault();e.currentTarget.setPointerCapture(e.pointerId);drag={id:e.pointerId,x:e.clientX,y:e.clientY}});$('look').addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;player.a-=(e.clientX-drag.x)*.005;player.p=Math.max(-.34,Math.min(.34,player.p+(e.clientY-drag.y)*.003));drag={id:e.pointerId,x:e.clientX,y:e.clientY}});for(const ev of ['lostpointercapture','pointercancel','pointerup'])$('look').addEventListener(ev,()=>drag=null);
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(ready&&mode==='walk'){if(keys.has('KeyA')||keys.has('ArrowLeft'))player.a+=1.95*dt;if(keys.has('KeyD')||keys.has('ArrowRight'))player.a-=1.95*dt;const step=((keys.has('KeyW')||keys.has('ArrowUp'))?1:0)-((keys.has('KeyS')||keys.has('ArrowDown'))?1:0);const dist=step*3.6*(player.run||keys.has('ShiftLeft')||keys.has('ShiftRight')?1.8:1)*dt;player.x+=Math.cos(player.a)*dist;player.y+=Math.sin(player.a)*dist;camera();const p=ll(player.x,player.y);$('coords').textContent=p.lat.toFixed(5)+', '+p.lng.toFixed(5);}requestAnimationFrame(frame)}requestAnimationFrame(frame);
window.__sxsReview={get ready(){return ready},get mode(){return mode},get threeDBuildings(){return !!map.getLayer('sxs-3d-buildings')},get position(){return ll(player.x,player.y)}};
</script></body></html>
